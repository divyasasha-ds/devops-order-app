apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-order-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-order-app
  template:
    metadata:
      labels:
        app: devops-order-app
    spec:
      containers:
        - name: devops-order-app
          image: divyasasha/devops-order-app:1.0
          ports:
            - containerPort: 5000