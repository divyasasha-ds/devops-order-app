<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | DevOps Order Management</title>

    <!-- Connect our CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Available Products 🛍️</h1>

        <p class="subtitle">
            Choose your product
        </p>

        <div class="card-container">

            {% for product in products %}

            <div class="card">

                <h2>{{ product.name }}</h2>

                <p class="price">
                    ₹{{ product.price }}
                </p>

                <a href="#" class="btn">
                    Add to Order
                </a>

            </div>

            {% endfor %}

        </div>

        <br>

        <a href="/" class="btn">
            ← Back to Home
        </a>

    </div>

</body>

</html>
